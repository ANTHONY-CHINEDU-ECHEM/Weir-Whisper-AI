    pressure_design_barg: 17.2
    latent_heat_kj_kg: 330.0
    feed_cp_kj_kg_k: 2.75
    feed_bubble_temp_c: 47.0
    feed_temp_design_c: 45.0
    feed_design_t_h: 36.0
    distillate_fraction: 0.62
