    bottom_impurity_design: 0.684
    bottom_impurity_spec: 0.90
    top_temp_design_c: 46.0
    sens_temp_design_c: 88.0
    bottom_temp_design_c: 109.0
    steam_latent_kj_kg: 2085.0
    reboiler_capacity_factor: 1.30
    chest_pressure_design_barg: 2.6
    downgrade_price_per_t: 55.0
  C301:
    unit: 3
