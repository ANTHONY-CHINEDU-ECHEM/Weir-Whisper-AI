    feed_cp_kj_kg_k: 2.80
    feed_bubble_temp_c: 52.0
    feed_temp_design_c: 50.0
    feed_design_t_h: 41.0
    distillate_fraction: 0.18
    reflux_ratio_design: 3.4
    murphree_eff: 0.72
    sep_sensitivity_top: 3.0
    sep_sensitivity_bottom: 3.4
    top_impurity_design: 1.14
    top_impurity_spec: 1.50
    bottom_impurity_design: 0.228
