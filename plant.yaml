# Plant definition for the Brackmere Olefins and Refining Complex (fictional site).
# Every column is described by its design basis. Hole area and flooding capacity
# coefficients are derived by the simulator so that the design weep margin and
# design flood fraction below are honoured exactly at 100 percent of design feed.

site:
  name: Brackmere Olefins and Refining Complex
  timezone: Europe/London
  areas:
    AREA2: [C101, C201, C301]
    AREA3: [C401, C501, C601]

economics:
  currency: GBP
  lp_steam_price_per_t: 31.5        # GBP per tonne of LP steam
  steam_co2_t_per_t: 0.205          # tCO2e emitted per tonne of LP steam raised
  carbon_price_per_t: 72.0          # GBP per tCO2e (UK ETS planning assumption)

columns:
  C101:
    unit: 1
    name: Debutaniser
    service: Separates C4 LPG overhead from stabilised naphtha bottoms
    tray_type: moving valve
    n_trays: 36
    feed_tray: 16                   # counted from the top
    diameter_m: 2.6
    tray_spacing_m: 0.61
    weir_height_mm: 50
    hole_diameter_mm: 12.7
    weep_k2_offset: -2.5            # valve trays hold liquid better than sieve trays
    design_weep_margin: 1.42
    design_flood: 0.80
    rho_liquid: 560.0
    rho_vapour_design: 21.0
    surface_tension_mN_m: 9.5
    pressure_design_barg: 10.5
    latent_heat_kj_kg: 330.0
    feed_cp_kj_kg_k: 2.55
    feed_bubble_temp_c: 118.0
    feed_temp_design_c: 116.0
    feed_design_t_h: 118.0
    distillate_fraction: 0.31
    reflux_ratio_design: 1.9
    murphree_eff: 0.78
    sep_sensitivity_top: 3.2        # factor rise in top impurity when tray efficiency falls by 0.20
    sep_sensitivity_bottom: 3.0
    top_impurity_design: 0.76       # mol percent C5 in LPG
    top_impurity_spec: 1.00
    bottom_impurity_design: 0.532    # mol percent C4 in naphtha (RVP driver)
    bottom_impurity_spec: 0.70
    top_temp_design_c: 61.0
    sens_temp_design_c: 128.0
    bottom_temp_design_c: 178.0
    steam_latent_kj_kg: 2085.0
    reboiler_capacity_factor: 1.30
    chest_pressure_design_barg: 2.4
    downgrade_price_per_t: 38.0     # GBP per tonne of off spec product reprocessed
  C201:
    unit: 2
    name: Depropaniser
    service: Separates propane and propylene overhead from C4 bottoms
    tray_type: sieve
    n_trays: 45
    feed_tray: 22
    diameter_m: 1.9
    tray_spacing_m: 0.61
    weir_height_mm: 50
    hole_diameter_mm: 12.7
    weep_k2_offset: 0.0
    design_weep_margin: 1.30
    design_flood: 0.79
    rho_liquid: 495.0
    rho_vapour_design: 34.0
    surface_tension_mN_m: 5.8
    pressure_design_barg: 16.8
    latent_heat_kj_kg: 300.0
    feed_cp_kj_kg_k: 2.70
    feed_bubble_temp_c: 82.0
    feed_temp_design_c: 80.0
    feed_design_t_h: 64.0
    distillate_fraction: 0.38
